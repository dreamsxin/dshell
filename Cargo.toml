[package]
name = "dshell"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0"
gpui = "0.2.2"
gpui-component = { version = "0.3.0", default-features = false }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"
