[package]
name = "dshell"
version = "0.1.17"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0"
gpui = "0.2.2"
gpui-component = { version = "0.3.0", default-features = false }
rand = "0.10"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
